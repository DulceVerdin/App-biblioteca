<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ titulo }} | Biblioteca Universitaria Central</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <style>
      .bg-rosa {
        background-color: #e83e8c !important; /* Puedes cambiar el código hexadecimal por el tono de rosa que prefieras */
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-rosa">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('inicio') }}">Biblioteca Universitaria Central</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a>
          <a class="nav-link" href="{{ url_for('catalogo') }}">Catálogo</a>
          <a class="nav-link" href="{{ url_for('servicios') }}">Servicios</a>
          <a class="nav-link" href="{{ url_for('contacto') }}">Contacto</a>
        </div>
      </div>
    </nav>

    <main class="container-fluid py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
